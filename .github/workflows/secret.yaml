# Teaching example only: use a dummy value, never a real credential.
# GitHub should mask the secret as *** in the logs. Never rely on masking alone.

name: Secret masking example

on:
  workflow_dispatch:

permissions: {}

jobs:
  demonstrate-secret:
    runs-on: ubuntu-latest

    steps:
      - name: Demonstrate masking with a dummy secret
        # Pass the secret through the environment rather than inserting it into shell code.
        env:
          DEMO_SECRET: ${{ secrets.DEMO_SECRET }}
        shell: bash
        run: |
          if [ -z "$DEMO_SECRET" ]; then
            echo "Create the DEMO_SECRET repository secret using a dummy value first."
            exit 1
          fi
          # For this demonstration only. Never print real secrets.
          printf 'Dummy secret (expected to be masked): %s\n' "$DEMO_SECRET"
