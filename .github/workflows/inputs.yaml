# These inputs appear in the Run workflow form on GitHub.
name: Manual inputs

on:
  workflow_dispatch:
    inputs:
      greeting:
        description: Message to print
        required: true
        default: Hello World!
        type: string
      repetitions:
        description: Number of times to print the message
        required: true
        default: "3"
        type: choice
        options:
          - "1"
          - "3"
          - "5"

permissions:
  contents: read

jobs:
  greet:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Print the chosen greeting
        # Environment variables keep user input separate from executable code.
        env:
          GREETING: ${{ inputs.greeting }}
          REPETITIONS: ${{ inputs.repetitions }}
        run: |
          python - <<'PY'
          import os

          greeting = os.environ["GREETING"]
          repetitions = int(os.environ["REPETITIONS"])
          if repetitions not in [1, 3, 5]:
              raise ValueError("Choose 1, 3, or 5 repetitions")

          for number in range(repetitions):
              print(greeting)
          PY
