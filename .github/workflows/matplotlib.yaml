# Create a plot without a graphical display and upload the image.
name: Matplotlib plot

on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  plot:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"

      - name: Install project and dependencies
        # Matplotlib is already declared in pyproject.toml.
        run: uv sync --locked

      - name: Generate plot
        env:
          MPLBACKEND: Agg  # Save images without needing a graphical display.
        run: uv run --locked python src/examples/plot.py

      - name: Upload plot
        uses: actions/upload-artifact@v7
        with:
          name: example-plot
          path: plot.png
          if-no-files-found: error
          retention-days: 7
