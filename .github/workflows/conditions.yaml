# The if key decides whether an individual step should run.
name: Conditional steps

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

permissions: {}

jobs:
  conditions:
    runs-on: ubuntu-latest
    steps:
      - name: Run for every trigger
        run: echo "This step runs for every trigger configured above."

      - name: Run only on main
        if: github.ref == 'refs/heads/main'
        run: echo "This run is on the main branch."

      - name: Run only for pull requests
        if: github.event_name == 'pull_request'
        run: echo "This run was triggered by a pull request."

      - name: Run only for manual dispatch
        if: github.event_name == 'workflow_dispatch'
        run: echo "This run was started manually."
