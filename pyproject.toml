[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "example-actions"
version = "1.1.1.dev1"
description = "Example GitHub Actions workflows for a lecture series."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = [
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
]

[project.urls]
Repository = "https://github.com/ICR-Computational-Imaging/example_actions"

[dependency-groups]
dev = [
    "bump2version>=1.0.1",
    "pytest>=8",
    "ruff>=0.14",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
